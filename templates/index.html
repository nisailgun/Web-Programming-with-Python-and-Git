<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Sentiment Analysis App</h1>
    <p>Web Programming with Python and Git – Term Project</p>
</header>

<main class="container">
    <section class="box">
        <h2>Enter Text</h2>
        <textarea id="textInput" placeholder="Type a sentence..."></textarea>
        <button id="analyzeBtn">Analyze</button>
    </section>

    <section class="box">
        <h2>Result</h2>
        <p><strong>Sentiment:</strong> <span id="result">-</span></p>
    </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
